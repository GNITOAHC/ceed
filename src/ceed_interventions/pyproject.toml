[project]
name = "ceed-interventions"
version = "0.1.0"
description = "Region selection, inpainting, control matching, and text-substitution counterfactuals."
requires-python = ">=3.13,<3.14"
dependencies = [
    "ceed-core",
    "diffusers>=0.32",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceed_interventions"]
