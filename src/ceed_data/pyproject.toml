[project]
name = "ceed-data"
version = "0.1.0"
description = "Corpus assembly: DocVQA, GQA, and ChartQA normalised into one Example type."
requires-python = ">=3.13,<3.14"
dependencies = [
    "ceed-core",
    "datasets>=3.2",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceed_data"]
