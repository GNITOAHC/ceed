[project]
name = "ceed-core"
version = "0.1.0"
description = "CEED domain types, configuration schema, artifact store, and extraction fingerprinting."
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.1",
    "jaxtyping>=0.3",
    "numpy>=2.1",
    "pyarrow>=18.0",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceed_core"]
