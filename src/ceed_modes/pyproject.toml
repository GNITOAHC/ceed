[project]
name = "ceed-modes"
version = "0.1.0"
description = "Attribution clustering into Modes, and the Phase 0 analyses."
requires-python = ">=3.13,<3.14"
dependencies = [
    "ceed-core",
    "duckdb>=1.1",
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "scipy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceed_modes"]
