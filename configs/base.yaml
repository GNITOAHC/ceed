# Base overlay: settings shared by every Group before the student, Group, and
# optional Phase 2 overlays are applied on top. See ceed_core.config.
seed: 0
param_efficiency: lora

layer_mapping:
  # The placeholder that unblocks B3 and B5 until the probe-based mapping study
  # replaces it. These pairs are exactly
  #   ceed_core.proportional_mapping((9, 19, 29), 30, 42)
  # -- floor(layer * 42 / 30), the same relative depth in a 30-layer Teacher and a
  # 42-layer Student -- and tests/test_layer_mapping.py asserts that, so the
  # config cannot drift away from the rule it claims to follow.
  kind: proportional
  pairs:
    - [9, 12]
    - [19, 26]
    - [29, 40]

extraction:
  # The Hugging Face repo id, lowercase as the hub and the local cache hold it.
  teacher_model: google/gemma-4-26b-a4b-it
  model_revision: main
  layers: [9, 19, 29]
  ablation: mean-of-active
  combine_weight: effective
  thinking_enabled: false
