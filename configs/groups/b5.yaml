# B5: router-score distillation — the original RACD design, kept as the internal
# ablation of CEED's premise.
#
# A removable probe on the Student's residual state predicts the Teacher's
# effective combine weights (plan amendment A3: the softmax top-k weight times
# the per-expert scale, the number that actually multiplies an expert's output).
# B5 therefore distils what the router *asserts*; E1 distils what ablation
# *measures*. The gap between them is CEED's thesis, and if Phase 0.1 finds the
# two agree, B5 is the fallback design the plan falls back to.
#
# This is also the Group that demonstrates the auxiliary-signal contract: adding
# it was one component and this file.
group_code: B5
corpus:
  name: ceed-vqa
  splits: [train]
auxiliary_signals:
  - name: combine_weight_probe
    weight: 1.0
training:
  steps: 2000
  learning_rate: 1.0e-4
  batch_size: 8
  checkpoint_every: 200
  backbone:
    kd_weight: 1.0 # identical to B2: only the auxiliary signal differs
    kd_temperature: 2.0
  warmup:
    backbone_only_steps: 200 # the probe is untrained at step 0; let the backbone
    ramp_steps: 200 # settle before its noise reaches the Student
evaluation:
  datasets: [docvqa, gqa, chartqa]
  decoding:
    do_sample: false # greedy, enforced in code regardless (A9)
    max_new_tokens: 64
